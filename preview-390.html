<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px preview</title>
<style>
  body{margin:0;background:#222;font:12px/1.4 -apple-system,sans-serif;color:#ddd}
  .row{display:flex;gap:12px;padding:12px;align-items:flex-start}
  .col{background:#000;border:1px solid #555}
  .lb{padding:6px 8px;color:#9f9}
  iframe{display:block;width:390px;border:0;background:#fff}
</style>
</head>
<body>
  <div class="row">
    <div class="col">
      <div class="lb">HERO 390px</div>
      <iframe src="/" width="390" height="1000" title="hero 390"></iframe>
    </div>
    <div class="col">
      <div class="lb">CASES 390px (#cases)</div>
      <iframe src="/#cases" width="390" height="1500" title="cases 390"></iframe>
    </div>
  </div>
</body>
</html>
