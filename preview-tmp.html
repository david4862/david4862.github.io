<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>임시 미리보기</title>
<style>
  body{margin:0;background:#20242b;padding:14px;font-family:-apple-system,sans-serif;color:#fff}
  h1{font-size:14px;margin:0 0 10px}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .col p{margin:0 0 6px;font-size:12px;color:#9fd0b5}
  iframe{background:#08251b;border:1px solid #444;display:block}
</style>
</head>
<body>
<h1>임시 미리보기 — 실제 사이트를 폭 390 / 360 iframe으로 렌더</h1>
<div class="row">
  <div class="col"><p>390px (iPhone)</p><iframe id="f390" src="/index.html?preview=390" width="390" height="1120" scrolling="yes"></iframe></div>
  <div class="col"><p>360px</p><iframe id="f360" src="/index.html?preview=360" width="360" height="1120" scrolling="yes"></iframe></div>
</div>
</body>
</html>
